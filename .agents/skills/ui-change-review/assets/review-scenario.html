<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SCENARIO_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #ffffff;
      --subtle: #f4f5f6;
      --ink: #1b1d1f;
      --muted: #62686e;
      --border: #d8dcdf;
      --after: #176b62;
    }

    * { box-sizing: border-box; }
    html { min-width: 300px; background: var(--surface); }
    body {
      min-width: 300px;
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background: var(--surface);
      font-family: "Aptos", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    .scenario-heading { display: grid; grid-template-columns: minmax(220px, 0.8fr) minmax(0, 1.2fr); gap: 24px; align-items: end; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 20px; line-height: 1.3; }
    .scenario-heading p { margin: 4px 0 0; color: var(--muted); }
    .callouts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .callouts li { padding: 5px 8px; color: #125d55; background: #e8f3f1; border-radius: 5px; font-size: 12px; font-weight: 650; }

    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .state { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 7px; }
    .state.after { border-color: #8abdb7; }
    .state-label { display: flex; min-height: 44px; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--subtle); border-bottom: 1px solid var(--border); }
    .state-label strong { font-size: 13px; }
    .state-label span { color: var(--muted); font-size: 12px; }
    .product-surface { min-height: 480px; padding: 20px; background: var(--surface); }

    /* Replace the sample surface below with product-specific styles and markup. */
    .sample { display: grid; min-height: 440px; place-items: center; color: var(--muted); background: var(--subtle); border: 1px dashed var(--border); border-radius: 6px; text-align: center; }

    @media (max-width: 760px) {
      body { padding: 12px; }
      .scenario-heading, .comparison { grid-template-columns: 1fr; }
      .callouts { justify-content: flex-start; }
      .product-surface { min-height: 360px; }
      .sample { min-height: 320px; }
    }
  </style>
</head>
<body>
  <header class="scenario-heading">
    <div>
      <h1>{{SCENARIO_TITLE}}</h1>
      <p>{{SCENARIO_CONTEXT}}</p>
    </div>
    <ul class="callouts" aria-label="Visible changes">
      <li>{{CALLOUT_1}}</li>
      <li>{{CALLOUT_2}}</li>
    </ul>
  </header>

  <main class="comparison">
    <section class="state before" aria-labelledby="before-title">
      <header class="state-label">
        <strong id="before-title">Before</strong>
        <span>{{SHARED_VIEWPORT_AND_DATA}}</span>
      </header>
      <div class="product-surface">
        <div class="sample">Replace with the grounded current UI.</div>
      </div>
    </section>

    <section class="state after" aria-labelledby="after-title">
      <header class="state-label">
        <strong id="after-title">After</strong>
        <span>{{SHARED_VIEWPORT_AND_DATA}}</span>
      </header>
      <div class="product-surface">
        <div class="sample">Replace with the proposed UI using equivalent data.</div>
      </div>
    </section>
  </main>

  <script>
    function reportHeight() {
      window.parent.postMessage({
        type: "ui-review:height",
        height: document.documentElement.scrollHeight,
      }, "*");
    }

    new ResizeObserver(reportHeight).observe(document.documentElement);
    window.addEventListener("load", reportHeight);
  </script>
</body>
</html>
